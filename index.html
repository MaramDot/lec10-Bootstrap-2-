<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <nav class="container-fluid bg-primary text-white p-3 fw-bold">My Website</nav>
    <div class="container-fluid">
        <div class="row bg-light p-4">

            <div class="col-12 col-lg-3 bg-light">
                <div class="container">
                    <ul class="list-group p-2">
                        <li class="list-group-item active">Dashboard</li>
                        <li class="list-group-item">Users</li>
                        <li class="list-group-item">Orders</li>
                        <li class="list-group-item">Settings</li>
                    </ul>
                </div>
            </div>
            <div class="col-12 col-lg-9 ">
                <div class="row">
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card m-1">
                            <div class="card-body">
                                <h5 class="card-title">Total Users: 1000</h5>
                                <h5>Orders: 754</h5>
                                <span class="badge bg-info rounded-pill">New</span>

                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card m-1">
                            <div class="card-body">
                                <h5 class="card-title">Total Users: 650</h5>
                                <h5>Orders: 321</h5>
                                <span class="badge bg-warning rounded-pill">Pending</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card m-1">
                            <div class="card-body">
                                <h5 class="card-title">Total Users: 1200</h5>
                                <h5>Orders: 1020</h5>
                                <span class="badge bg-success rounded-pill">Done</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="table-responsive mt-4">
                    <table class="table table-striped table-hover m-1">
                        <thead class="table-dark">
                            <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>5</td>
                                <td>Maram</td>
                                <td>maram@gmail.com</td>
                                <td><span class="badge bg-success rounded-pill">Active</span></td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Lama</td>
                                <td>lama@gmail.com</td>
                                <td><span class="badge bg-danger rounded-pill">Inactive</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
    </div>
</body>

</html>
